name: Environment Variables

on:
  push:
  workflow_dispatch:

env:
  APP_ENV: development

jobs:
  show-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Print app environment
        run: echo "App environment is $APP_ENV"

      - name: Print stage
        env:
          STAGE: test
        run: echo "Stage is $STAGE"
